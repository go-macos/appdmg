name: ci

# The image this package writes is read on macOS, but nothing in it is
# darwin-only: the volume, the records and the container are all bytes. The
# tests are EXECUTED on every architecture, under emulation where it is not
# native, because a cross-build proves only that it compiles -- and the .DS_Store
# and the UDIF trailer underneath are big-endian, so s390x is where a forgotten
# byte-order conversion shows up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"
            exit 1
          fi
      - run: go test -count=1 ./...

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race -count=1 ./...

  # THE FLEET STANDARD IS 100%, AND THIS REPOSITORY DOES NOT MEET IT.
  #
  # It sits at 95.9%. What is missing is named rather than waved at: the
  # branches that report a failure from filepath.Rel, fs.DirEntry.Info and
  # os.Readlink on an entry the walk has just handed over, and the pass-throughs
  # for two calls that cannot fail on a volume this package has just built
  # itself, plus main() in cmd/appdmg, which is one line calling run(). The calls that CROSS a package boundary -- laying out the volume,
  # wrapping it, renaming the result -- are behind seams in seams.go and are
  # made to fail in the tests, because those are the ones whose error text a
  # caller will one day read.
  #
  # The floor refuses a regression and prints the distance to the standard.
  # THE FLOOR IS NOT THE STANDARD; the job name says so.
  coverage-floor:
    name: coverage floor (95.0%, standard is 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          FLOOR=95.0
          go test -coverprofile=cover.out ./... >/dev/null
          go tool cover -func=cover.out
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%  standard: 100%"
          awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}' && {
            echo "::error::coverage ${cov}% fell below the recorded floor ${FLOOR}%"; exit 1; }
          awk -v c="$cov" 'BEGIN{if (c+0 < 100) printf "::warning::%.1f points short of the 100%% fleet standard\n", 100-c}'

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test
        run: |
          # ⛔ Resolve the emulator, accept EITHER binary name, and FAIL when neither
          # is there -- a lane that reports success for an architecture it never ran is
          # the one outcome this matrix exists to rule out. qemu-user ships the dynamic
          # qemu-<arch>; qemu-user-static, now a virtual package, shipped the static one.
          qemu_for() {
            for cand in "qemu-$1-static" "qemu-$1"; do
              command -v "$cand" >/dev/null 2>&1 && { printf '%s\n' "$cand"; return 0; }
            done
            echo "::error::no qemu user emulator for $1 (looked for qemu-$1-static and qemu-$1)" >&2
            return 1
          }
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64) e="$(qemu_for riscv64)" || exit 1; echo "running riscv64 under $e"; GOARCH=riscv64 go test -count=1 -exec="$e" ./... ;;
            loong64) e="$(qemu_for loongarch64)" || exit 1; echo "running loong64 under $e"; GOARCH=loong64 go test -count=1 -exec="$e" ./... ;;
            ppc64le) e="$(qemu_for ppc64le)" || exit 1; echo "running ppc64le under $e"; GOARCH=ppc64le go test -count=1 -exec="$e" ./... ;;
            s390x) e="$(qemu_for s390x)" || exit 1; echo "running s390x under $e"; GOARCH=s390x   go test -count=1 -exec="$e" ./... ;;
          esac
